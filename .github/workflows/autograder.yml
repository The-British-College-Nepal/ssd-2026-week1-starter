name: Week 1 Lab Autograder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Run JUnit 5 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile and Test with Maven
        run: mvn -B test --no-transfer-progress

      - name: Check SETUP.md
        run: |
          if [ -f "SETUP.md" ]; then
            echo "✅ SETUP.md is present"
          else
            echo "⚠️ Warning: SETUP.md is missing. Please complete your setup verification."
          fi
